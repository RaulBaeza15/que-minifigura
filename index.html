const $=id=>document.getElementById(id);
const LANGS=[["es","ES"],["en","EN"],["fr","FR"],["de","DE"],["it","IT"],["pt","PT"],["tr","TR"]];
let lang='es';try{lang=localStorage.getItem('qmf.lang')||((navigator.language||'es').slice(0,2).toLowerCase())}catch{}if(!T[lang])lang='en';
const t=k=>(T[lang]&&T[lang][k])||T.en[k]||k;
const CODEMAP={};DB.forEach((s,si)=>s.figs.forEach((f,fi)=>{for(const fac in f.codes)f.codes[fac].forEach(c=>CODEMAP[c]={si,fi,fac})}));
let found=[];try{found=JSON.parse(localStorage.getItem('qmf.found.v1')||'[]')}catch{found=[]}
const msg=s=>{$('status').textContent=s};
function saveFound(){try{localStorage.setItem('qmf.found.v1',JSON.stringify(found))}catch{}}
function regionOf(f){return Object.keys(f.codes).map(x=>x==='S'?t('regionEU'):t('regionUS')).join(' · ')}
function metaOf(it){let s=DB[it.si],f=s.figs[it.fi];return s.name+' · '+s.year+' · '+t('codeL')+' '+it.code+' · '+regionOf(f)}
function renderFound(){let block=$('found-block'),list=$('found-list');if(!found.length){block.style.display='none';return}block.style.display='block';$('found-title').textContent=t('foundN')+' ('+found.length+')';list.innerHTML='';found.forEach((it,idx)=>{let s=DB[it.si],f=s.figs[it.fi];let d=document.createElement('div');d.className='fitem';let img=document.createElement('img');img.loading='lazy';img.src=CDN+f.img;img.alt=f.name;img.onerror=()=>{img.style.display='none'};let m=document.createElement('div');m.className='fm';let n=document.createElement('div');n.className='fn';n.textContent=f.name;let dd=document.createElement('div');dd.className='fd';dd.textContent=metaOf(it);m.append(n,dd);let x=document.createElement('button');x.className='fdel';x.textContent='×';x.setAttribute('aria-label','x');x.onclick=()=>{found.splice(idx,1);saveFound();renderFound()};d.append(img,m,x);list.appendChild(d)})}
function showLast(it){let s=DB[it.si],f=s.figs[it.fi];$('last').style.display='block';$('fig-name').textContent=f.name;let img=$('fig-img');img.style.display='';img.onerror=()=>{img.style.display='none'};img.src=CDN+f.img;$('fig-chips').innerHTML='';[[t('seriesL'),s.name],[t('yearL'),s.year],[t('codeL'),it.code],[t('regionL'),regionOf(f)]].forEach(([k,v])=>{let c=document.createElement('span');c.className='chip';let b=document.createElement('b');b.textContent=k+': ';c.appendChild(b);c.appendChild(document.createTextNode(v));$('fig-chips').appendChild(c)});let l=$('last');l.classList.remove('flash');void l.offsetWidth;l.classList.add('flash')}
function addFound(hit,code){let it={si:hit.si,fi:hit.fi,code,ts:Date.now()};found.unshift(it);saveFound();renderFound();showLast(it);try{navigator.vibrate&&navigator.vibrate(70)}catch{};let vw=document.querySelector('.video-wrap');if(vw){vw.classList.add('hit');setTimeout(()=>vw.classList.remove('hit'),500)}msg(t('found')+' '+DB[it.si].figs[it.fi].name)}
$('clear').onclick=()=>{found=[];saveFound();renderFound();$('last').style.display='none'};
function extractCode(text){text=String(text||'').trim();let fm=text.match(/^\s*\d{6,8}\s+\d{3}([RS])\d/i);let m=text.match(/^\s*(\d{6,8})(\s|$)/);let code=m?m[1]:null;if(!code){let any=text.match(/\d{7}/);if(any)code=any[0]}return{code,factory:fm?fm[1].toUpperCase():null,raw:text}}
function lookupText(text){let{code}=extractCode(text);if(!code){msg(t('notFound')+' — '+t('notFoundAdvice'));return false}let hit=CODEMAP[code];if(hit){addFound(hit,code);return true}else if(/^\d{12,13}$/.test(code)||/^\d{8}$/.test(code)){msg(t('boxBarcode'))}else{msg(t('notFound')+' — '+t('notFoundAdvice'))}return false}
let stream=null,controls=null,reader=null,lastCode='',lastAt=0;
function hints(){let h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8]);return h}
function stopScan(){controls?.stop?.();controls=null;reader=null;stream?.getTracks().forEach(tr=>tr.stop());$('video').srcObject=null;stream=null;$('camera-stage').style.display='none';$('scan').textContent=t('scanBtn')}
function onDetected(text){let{code}=extractCode(text);if(!code)return;let now=Date.now();if(code===lastCode&&now-lastAt<3000)return;lastCode=code;lastAt=now;lookupText(text)}
$('scan').onclick=async()=>{if(stream||controls){stopScan();msg(t('camClosed'));return}if(!navigator.mediaDevices?.getUserMedia){msg(t('camPermission'));return}try{let video=$('video');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;$('camera-stage').style.display='block';$('scan').textContent=t('closeCam');await video.play();if(window.BarcodeDetector){let formats=await BarcodeDetector.getSupportedFormats(),want=['data_matrix','qr_code','upc_a','ean_13','ean_8'].filter(x=>formats.includes(x));if(want.length){let detector=new BarcodeDetector({formats:want}),active=true;controls={stop(){active=false}};msg(t('camOpen'));while(active){let codes=await detector.detect(video).catch(()=>[]);if(codes.length)onDetected(codes[0].rawValue);await new Promise(r=>setTimeout(r,280))}return}}if(window.ZXing){reader=new ZXing.BrowserMultiFormatReader(hints());let active=true;controls={stop(){active=false;reader.reset()}};msg(t('camOpen'));reader.decodeContinuously(video,(result,error)=>{if(!active)return;if(result)onDetected(result.getText?result.getText():result.text)})}else{stopScan();msg(t('readerOff'))}}catch(e){stopScan();msg(t('camErr'))}};
$('codephoto').onchange=async e=>{let f=e.target.files[0];if(!f)return;msg(t('searching'));let url=URL.createObjectURL(f);try{if(window.BarcodeDetector){let b=await createImageBitmap(f),formats=await BarcodeDetector.getSupportedFormats(),want=['data_matrix','qr_code','upc_a','ean_13','ean_8'].filter(x=>formats.includes(x));if(want.length){let d=new BarcodeDetector({formats:want}),v=await d.detect(b);b.close();if(v.length){lookupText(v[0].rawValue);return}}}if(window.ZXing){let img=await createImageBitmap(f),cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;let ctx=cv.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0);img.close();let r=await new ZXing.BrowserMultiFormatReader(hints()).decodeFromImageUrl(cv.toDataURL('image/png'));lookupText(r.getText?r.getText():r.text);return}msg(t('photoFail'))}catch{msg(t('photoFail'))}finally{URL.revokeObjectURL(url);e.target.value=''}};
$('manualbtn').onclick=()=>{if(lookupText($('manual').value))$('manual').value=''};$('manual').addEventListener('keydown',e=>{if(e.key==='Enter'){if(lookupText($('manual').value))$('manual').value=''}});
function renderSeries(){let g=$('series-grid');g.innerHTML='';DB.forEach((s,si)=>{let d=document.createElement('button');d.className='series';let img=document.createElement('img');img.loading='lazy';img.src=CDN+s.figs[0].img;img.alt='';img.onerror=()=>{img.style.display='none'};let sn=document.createElement('div');sn.className='sn';sn.textContent=s.name;let sm=document.createElement('div');sm.className='sm';sm.textContent=s.year+' · '+s.figs.length+' '+t('figs');d.append(img,sn,sm);let grid=null;d.onclick=()=>{if(grid){grid.style.display=grid.style.display==='none'?'grid':'none';return}grid=document.createElement('div');grid.className='figgrid';grid.style.display='grid';s.figs.forEach(f=>{let c=document.createElement('div');c.className='figcell';let i=document.createElement('img');i.loading='lazy';i.src=CDN+f.img;i.alt=f.name;i.onerror=()=>{i.style.display='none'};let n=document.createElement('div');n.className='fn';n.textContent=f.name;c.append(i,n);grid.appendChild(c)});d.after(grid)};g.appendChild(d)})}
function applyI18n(){document.documentElement.lang=lang;document.title=t('metaTitle');document.querySelector('meta[name=description]').setAttribute('content',t('metaDesc'));document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));if(!stream&&!controls)$('scan').textContent=t('scanBtn');renderFound();renderSeries();if(found.length)showLast(found[0])}
const sel=$('lang');LANGS.forEach(([c,l])=>{let o=document.createElement('option');o.value=c;o.textContent=l;if(c===lang)o.selected=true;sel.appendChild(o)});sel.onchange=()=>{lang=sel.value;try{localStorage.setItem('qmf.lang',lang)}catch{};applyI18n()};
applyI18n();
</script></body></html>
