name: Replace social preview image
on:
  push:
    paths:
      - og-v2.png.base64
      - .github/workflows/replace-og.yml
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace the image
        run: |
          base64 -d og-v2.png.base64 > og.png
          rm og-v2.png.base64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og.png og-v2.png.base64
          git diff --cached --quiet || git commit -m "Replace social preview with real minifigure"
          git push
