name: Install social preview image
on:
  push:
    paths:
      - og.png.base64
      - .github/workflows/install-og.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image and commit
        run: |
          base64 -d og.png.base64 > og.png
          rm og.png.base64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og.png og.png.base64
          git diff --cached --quiet || git commit -m "Add social preview image"
          git push
